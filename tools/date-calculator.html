<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Calculator - Toolkity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <span>Toolkity</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-calendar"></i> Date Calculator</h1>
                <p>Calculate date differences and add/subtract days</p>
            </div>

            <div class="tool-container">
                <h3 style="margin-bottom: 1rem;">Calculate Difference Between Dates</h3>
                
                <div class="form-group">
                    <label for="startDate">Start Date:</label>
                    <input type="date" id="startDate">
                </div>

                <div class="form-group">
                    <label for="endDate">End Date:</label>
                    <input type="date" id="endDate">
                </div>

                <button class="btn btn-primary" onclick="calculateDifference()">
                    <i class="fas fa-calculator"></i> Calculate Difference
                </button>

                <div id="differenceResult" style="display: none; margin-top: 1.5rem;">
                    <div class="result-box">
                        <h3>Date Difference</h3>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-value" id="totalDays">0</div>
                                <div class="stat-label">Total Days</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="totalWeeks">0</div>
                                <div class="stat-label">Weeks</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="totalMonths">0</div>
                                <div class="stat-label">Months</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="totalYears">0</div>
                                <div class="stat-label">Years</div>
                            </div>
                        </div>
                    </div>
                </div>

                <hr style="margin: 2rem 0; border: none; border-top: 2px solid var(--border-color);">

                <h3 style="margin-bottom: 1rem;">Add/Subtract Days</h3>

                <div class="form-group">
                    <label for="baseDate">Base Date:</label>
                    <input type="date" id="baseDate">
                </div>

                <div class="form-group">
                    <label for="daysToAdd">Days to Add/Subtract:</label>
                    <input type="number" id="daysToAdd" placeholder="Enter positive or negative number">
                </div>

                <button class="btn btn-primary" onclick="addDays()">
                    <i class="fas fa-plus"></i> Calculate New Date
                </button>

                <div id="addResult" style="display: none; margin-top: 1.5rem;">
                    <div class="result-box">
                        <h3>Result Date</h3>
                        <div style="text-align: center; padding: 1rem;">
                            <div style="font-size: 2rem; font-weight: 700; color: var(--primary-color);" id="resultDate"></div>
                            <div style="color: var(--text-light); margin-top: 0.5rem;" id="resultDayOfWeek"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Toolkity. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        // Set default dates
        const today = new Date();
        document.getElementById('startDate').valueAsDate = today;
        document.getElementById('endDate').valueAsDate = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);
        document.getElementById('baseDate').valueAsDate = today;

        function calculateDifference() {
            const startDate = new Date(document.getElementById('startDate').value);
            const endDate = new Date(document.getElementById('endDate').value);

            if (!document.getElementById('startDate').value || !document.getElementById('endDate').value) {
                alert('Please select both dates');
                return;
            }

            const diffTime = Math.abs(endDate - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const diffWeeks = Math.floor(diffDays / 7);
            const diffMonths = Math.floor(diffDays / 30.44);
            const diffYears = Math.floor(diffDays / 365.25);

            document.getElementById('totalDays').textContent = diffDays;
            document.getElementById('totalWeeks').textContent = diffWeeks;
            document.getElementById('totalMonths').textContent = diffMonths;
            document.getElementById('totalYears').textContent = diffYears.toFixed(2);

            document.getElementById('differenceResult').style.display = 'block';
        }

        function addDays() {
            const baseDate = new Date(document.getElementById('baseDate').value);
            const daysToAdd = parseInt(document.getElementById('daysToAdd').value);

            if (!document.getElementById('baseDate').value) {
                alert('Please select a base date');
                return;
            }

            if (isNaN(daysToAdd)) {
                alert('Please enter a valid number of days');
                return;
            }

            const resultDate = new Date(baseDate);
            resultDate.setDate(resultDate.getDate() + daysToAdd);

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formattedDate = resultDate.toLocaleDateString('en-US', options);

            document.getElementById('resultDate').textContent = resultDate.toISOString().split('T')[0];
            document.getElementById('resultDayOfWeek').textContent = formattedDate;

            document.getElementById('addResult').style.display = 'block';
        }
    </script>
</body>
</html>
