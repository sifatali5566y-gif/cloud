<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converter - Toolkity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <span>Toolkity</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-text-height"></i> Case Converter</h1>
                <p>Convert text to uppercase, lowercase, title case, and more</p>
            </div>

            <div class="tool-container">
                <div class="form-group">
                    <label for="textInput">Enter your text:</label>
                    <textarea id="textInput" placeholder="Enter text to convert..."></textarea>
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" onclick="convertCase('uppercase')">
                        <i class="fas fa-font"></i> UPPERCASE
                    </button>
                    <button class="btn btn-secondary" onclick="convertCase('lowercase')">
                        <i class="fas fa-font"></i> lowercase
                    </button>
                    <button class="btn btn-secondary" onclick="convertCase('titlecase')">
                        <i class="fas fa-font"></i> Title Case
                    </button>
                    <button class="btn btn-secondary" onclick="convertCase('sentencecase')">
                        <i class="fas fa-font"></i> Sentence case
                    </button>
                    <button class="btn btn-secondary" onclick="convertCase('capitalize')">
                        <i class="fas fa-font"></i> Capitalize Words
                    </button>
                    <button class="btn btn-secondary" onclick="convertCase('alternating')">
                        <i class="fas fa-font"></i> aLtErNaTiNg CaSe
                    </button>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="copyText()">
                        <i class="fas fa-copy"></i> Copy Result
                    </button>
                    <button class="btn btn-secondary" onclick="clearText()">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Toolkity. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const textInput = document.getElementById('textInput');

        function convertCase(type) {
            let text = textInput.value;
            
            switch(type) {
                case 'uppercase':
                    textInput.value = text.toUpperCase();
                    break;
                case 'lowercase':
                    textInput.value = text.toLowerCase();
                    break;
                case 'titlecase':
                    textInput.value = text.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
                    break;
                case 'sentencecase':
                    textInput.value = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
                    break;
                case 'capitalize':
                    textInput.value = text.replace(/\b\w/g, c => c.toUpperCase());
                    break;
                case 'alternating':
                    textInput.value = text.split('').map((char, i) => 
                        i % 2 === 0 ? char.toLowerCase() : char.toUpperCase()
                    ).join('');
                    break;
            }
        }

        function copyText() {
            textInput.select();
            document.execCommand('copy');
            alert('Text copied to clipboard!');
        }

        function clearText() {
            textInput.value = '';
        }
    </script>
</body>
</html>
