<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Base Converter - Toolkity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <span>Toolkity</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-binary"></i> Number Base Converter</h1>
                <p>Convert between binary, octal, decimal, and hexadecimal</p>
            </div>

            <div class="tool-container">
                <div class="form-group">
                    <label for="inputBase">Input Base:</label>
                    <select id="inputBase" onchange="convert()">
                        <option value="2">Binary (Base 2)</option>
                        <option value="8">Octal (Base 8)</option>
                        <option value="10" selected>Decimal (Base 10)</option>
                        <option value="16">Hexadecimal (Base 16)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="inputNumber">Enter Number:</label>
                    <input type="text" id="inputNumber" placeholder="Enter number" oninput="convert()">
                </div>

                <div id="messageArea"></div>

                <div class="result-box">
                    <h3>Converted Values</h3>
                    
                    <div class="form-group">
                        <label>Binary (Base 2):</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="binaryOutput" readonly style="flex: 1;">
                            <button class="btn btn-secondary" onclick="copyValue('binaryOutput')" style="padding: 8px 16px;">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Octal (Base 8):</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="octalOutput" readonly style="flex: 1;">
                            <button class="btn btn-secondary" onclick="copyValue('octalOutput')" style="padding: 8px 16px;">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Decimal (Base 10):</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="decimalOutput" readonly style="flex: 1;">
                            <button class="btn btn-secondary" onclick="copyValue('decimalOutput')" style="padding: 8px 16px;">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Hexadecimal (Base 16):</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="hexOutput" readonly style="flex: 1;">
                            <button class="btn btn-secondary" onclick="copyValue('hexOutput')" style="padding: 8px 16px;">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" onclick="clearAll()">
                        <i class="fas fa-trash"></i> Clear All
                    </button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Toolkity. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        function convert() {
            const inputNumber = document.getElementById('inputNumber').value.trim();
            const inputBase = parseInt(document.getElementById('inputBase').value);

            if (!inputNumber) {
                clearOutputs();
                return;
            }

            try {
                // Convert input to decimal first
                const decimal = parseInt(inputNumber, inputBase);

                if (isNaN(decimal)) {
                    showMessage('Invalid number for the selected base', 'error');
                    clearOutputs();
                    return;
                }

                // Convert to all bases
                document.getElementById('binaryOutput').value = decimal.toString(2);
                document.getElementById('octalOutput').value = decimal.toString(8);
                document.getElementById('decimalOutput').value = decimal.toString(10);
                document.getElementById('hexOutput').value = decimal.toString(16).toUpperCase();

                document.getElementById('messageArea').innerHTML = '';
            } catch (error) {
                showMessage('Error converting number: ' + error.message, 'error');
                clearOutputs();
            }
        }

        function clearOutputs() {
            document.getElementById('binaryOutput').value = '';
            document.getElementById('octalOutput').value = '';
            document.getElementById('decimalOutput').value = '';
            document.getElementById('hexOutput').value = '';
        }

        function copyValue(elementId) {
            const element = document.getElementById(elementId);
            if (element.value) {
                element.select();
                document.execCommand('copy');
                showMessage('Copied to clipboard!', 'success');
            }
        }

        function clearAll() {
            document.getElementById('inputNumber').value = '';
            clearOutputs();
            document.getElementById('messageArea').innerHTML = '';
        }

        function showMessage(message, type) {
            const messageArea = document.getElementById('messageArea');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            messageArea.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
            
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
