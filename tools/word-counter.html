<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter - Toolkity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <span>Toolkity</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-calculator"></i> Word Counter</h1>
                <p>Count words, characters, sentences, and paragraphs in your text</p>
            </div>

            <div class="tool-container">
                <div class="form-group">
                    <label for="textInput">Enter or paste your text:</label>
                    <textarea id="textInput" placeholder="Start typing or paste your text here..."></textarea>
                </div>

                <div class="result-box">
                    <h3>Statistics</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="wordCount">0</div>
                            <div class="stat-label">Words</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="charCount">0</div>
                            <div class="stat-label">Characters</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="charCountNoSpace">0</div>
                            <div class="stat-label">Characters (no spaces)</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="sentenceCount">0</div>
                            <div class="stat-label">Sentences</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="paragraphCount">0</div>
                            <div class="stat-label">Paragraphs</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="readingTime">0</div>
                            <div class="stat-label">Reading Time (min)</div>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="copyText()">
                        <i class="fas fa-copy"></i> Copy Text
                    </button>
                    <button class="btn btn-secondary" onclick="clearText()">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Toolkity. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const textInput = document.getElementById('textInput');

        textInput.addEventListener('input', updateStats);

        function updateStats() {
            const text = textInput.value;

            // Word count
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            document.getElementById('wordCount').textContent = words.length;

            // Character count
            document.getElementById('charCount').textContent = text.length;

            // Character count without spaces
            document.getElementById('charCountNoSpace').textContent = text.replace(/\s/g, '').length;

            // Sentence count
            const sentences = text.split(/[.!?]+/).filter(sentence => sentence.trim().length > 0);
            document.getElementById('sentenceCount').textContent = sentences.length;

            // Paragraph count
            const paragraphs = text.split(/\n+/).filter(para => para.trim().length > 0);
            document.getElementById('paragraphCount').textContent = paragraphs.length;

            // Reading time (assuming 200 words per minute)
            const readingTime = Math.ceil(words.length / 200);
            document.getElementById('readingTime').textContent = readingTime || 0;
        }

        function copyText() {
            textInput.select();
            document.execCommand('copy');
            alert('Text copied to clipboard!');
        }

        function clearText() {
            textInput.value = '';
            updateStats();
        }
    </script>
</body>
</html>
