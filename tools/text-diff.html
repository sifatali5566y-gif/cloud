<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Diff - Toolkity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .text-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .diff-result {
            margin-top: 1.5rem;
        }
        .diff-added {
            background-color: #d1fae5;
            color: #065f46;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .diff-removed {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 2px 4px;
            border-radius: 3px;
            text-decoration: line-through;
        }
        @media (max-width: 768px) {
            .text-comparison {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <span>Toolkity</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-code-compare"></i> Text Diff</h1>
                <p>Compare two texts and find differences</p>
            </div>

            <div class="tool-container">
                <div class="text-comparison">
                    <div class="form-group">
                        <label for="text1">Original Text:</label>
                        <textarea id="text1" placeholder="Enter original text..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="text2">Modified Text:</label>
                        <textarea id="text2" placeholder="Enter modified text..."></textarea>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="compareTexts()">
                        <i class="fas fa-exchange-alt"></i> Compare Texts
                    </button>
                    <button class="btn btn-secondary" onclick="clearAll()">
                        <i class="fas fa-trash"></i> Clear All
                    </button>
                </div>

                <div id="resultArea"></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Toolkity. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        function compareTexts() {
            const text1 = document.getElementById('text1').value;
            const text2 = document.getElementById('text2').value;
            
            const words1 = text1.split(/\s+/);
            const words2 = text2.split(/\s+/);
            
            let result = '<div class="diff-result"><div class="result-box"><h3>Comparison Result:</h3><p>';
            
            // Simple word-by-word comparison
            const maxLength = Math.max(words1.length, words2.length);
            
            for (let i = 0; i < maxLength; i++) {
                if (i >= words1.length) {
                    result += `<span class="diff-added">${words2[i]}</span> `;
                } else if (i >= words2.length) {
                    result += `<span class="diff-removed">${words1[i]}</span> `;
                } else if (words1[i] !== words2[i]) {
                    result += `<span class="diff-removed">${words1[i]}</span> <span class="diff-added">${words2[i]}</span> `;
                } else {
                    result += `${words1[i]} `;
                }
            }
            
            result += '</p></div></div>';
            
            document.getElementById('resultArea').innerHTML = result;
        }

        function clearAll() {
            document.getElementById('text1').value = '';
            document.getElementById('text2').value = '';
            document.getElementById('resultArea').innerHTML = '';
        }
    </script>
</body>
</html>
