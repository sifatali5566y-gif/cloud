<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatter - Toolkity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <span>Toolkity</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-align-left"></i> Text Formatter</h1>
                <p>Format, clean, and beautify your text</p>
            </div>

            <div class="tool-container">
                <div class="form-group">
                    <label for="textInput">Enter your text:</label>
                    <textarea id="textInput" placeholder="Enter text to format..."></textarea>
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" onclick="removeExtraSpaces()">
                        <i class="fas fa-compress"></i> Remove Extra Spaces
                    </button>
                    <button class="btn btn-secondary" onclick="removeLineBreaks()">
                        <i class="fas fa-minus"></i> Remove Line Breaks
                    </button>
                    <button class="btn btn-secondary" onclick="trimLines()">
                        <i class="fas fa-cut"></i> Trim Each Line
                    </button>
                    <button class="btn btn-secondary" onclick="removeEmptyLines()">
                        <i class="fas fa-stream"></i> Remove Empty Lines
                    </button>
                    <button class="btn btn-secondary" onclick="addLineNumbers()">
                        <i class="fas fa-list-ol"></i> Add Line Numbers
                    </button>
                    <button class="btn btn-secondary" onclick="reverseText()">
                        <i class="fas fa-exchange-alt"></i> Reverse Text
                    </button>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="copyText()">
                        <i class="fas fa-copy"></i> Copy Result
                    </button>
                    <button class="btn btn-secondary" onclick="clearText()">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Toolkity. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const textInput = document.getElementById('textInput');

        function removeExtraSpaces() {
            textInput.value = textInput.value.replace(/\s+/g, ' ').trim();
        }

        function removeLineBreaks() {
            textInput.value = textInput.value.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function trimLines() {
            const lines = textInput.value.split('\n');
            textInput.value = lines.map(line => line.trim()).join('\n');
        }

        function removeEmptyLines() {
            const lines = textInput.value.split('\n');
            textInput.value = lines.filter(line => line.trim().length > 0).join('\n');
        }

        function addLineNumbers() {
            const lines = textInput.value.split('\n');
            textInput.value = lines.map((line, index) => `${index + 1}. ${line}`).join('\n');
        }

        function reverseText() {
            textInput.value = textInput.value.split('').reverse().join('');
        }

        function copyText() {
            textInput.select();
            document.execCommand('copy');
            alert('Text copied to clipboard!');
        }

        function clearText() {
            textInput.value = '';
        }
    </script>
</body>
</html>
