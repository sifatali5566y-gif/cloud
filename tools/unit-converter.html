<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter - Toolkity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <span>Toolkity</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-ruler"></i> Unit Converter</h1>
                <p>Convert between different units of measurement</p>
            </div>

            <div class="tool-container">
                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" onchange="updateUnits()">
                        <option value="length">Length</option>
                        <option value="weight">Weight</option>
                        <option value="temperature">Temperature</option>
                        <option value="area">Area</option>
                        <option value="volume">Volume</option>
                        <option value="speed">Speed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fromValue">From:</label>
                    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 0.5rem;">
                        <input type="number" id="fromValue" placeholder="Enter value" oninput="convert()">
                        <select id="fromUnit" onchange="convert()"></select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="toValue">To:</label>
                    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 0.5rem;">
                        <input type="number" id="toValue" placeholder="Result" readonly>
                        <select id="toUnit" onchange="convert()"></select>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" onclick="swapUnits()">
                        <i class="fas fa-exchange-alt"></i> Swap Units
                    </button>
                    <button class="btn btn-secondary" onclick="clearAll()">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Toolkity. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const units = {
            length: {
                meter: 1,
                kilometer: 0.001,
                centimeter: 100,
                millimeter: 1000,
                mile: 0.000621371,
                yard: 1.09361,
                foot: 3.28084,
                inch: 39.3701
            },
            weight: {
                kilogram: 1,
                gram: 1000,
                milligram: 1000000,
                ton: 0.001,
                pound: 2.20462,
                ounce: 35.274
            },
            temperature: {
                celsius: 'c',
                fahrenheit: 'f',
                kelvin: 'k'
            },
            area: {
                'square meter': 1,
                'square kilometer': 0.000001,
                'square mile': 3.861e-7,
                'square yard': 1.19599,
                'square foot': 10.7639,
                'acre': 0.000247105,
                'hectare': 0.0001
            },
            volume: {
                liter: 1,
                milliliter: 1000,
                'cubic meter': 0.001,
                gallon: 0.264172,
                quart: 1.05669,
                pint: 2.11338,
                cup: 4.22675,
                'fluid ounce': 33.814
            },
            speed: {
                'meter/second': 1,
                'kilometer/hour': 3.6,
                'mile/hour': 2.23694,
                'foot/second': 3.28084,
                knot: 1.94384
            }
        };

        function updateUnits() {
            const category = document.getElementById('category').value;
            const unitList = Object.keys(units[category]);
            
            const fromUnit = document.getElementById('fromUnit');
            const toUnit = document.getElementById('toUnit');
            
            fromUnit.innerHTML = '';
            toUnit.innerHTML = '';
            
            unitList.forEach(unit => {
                fromUnit.innerHTML += `<option value="${unit}">${unit}</option>`;
                toUnit.innerHTML += `<option value="${unit}">${unit}</option>`;
            });
            
            if (unitList.length > 1) {
                toUnit.selectedIndex = 1;
            }
            
            convert();
        }

        function convert() {
            const category = document.getElementById('category').value;
            const fromValue = parseFloat(document.getElementById('fromValue').value);
            const fromUnit = document.getElementById('fromUnit').value;
            const toUnit = document.getElementById('toUnit').value;
            
            if (isNaN(fromValue)) {
                document.getElementById('toValue').value = '';
                return;
            }
            
            let result;
            
            if (category === 'temperature') {
                result = convertTemperature(fromValue, fromUnit, toUnit);
            } else {
                const fromFactor = units[category][fromUnit];
                const toFactor = units[category][toUnit];
                result = fromValue * (toFactor / fromFactor);
            }
            
            document.getElementById('toValue').value = result.toFixed(6).replace(/\.?0+$/, '');
        }

        function convertTemperature(value, from, to) {
            let celsius;
            
            if (from === 'celsius') celsius = value;
            else if (from === 'fahrenheit') celsius = (value - 32) * 5/9;
            else if (from === 'kelvin') celsius = value - 273.15;
            
            if (to === 'celsius') return celsius;
            else if (to === 'fahrenheit') return celsius * 9/5 + 32;
            else if (to === 'kelvin') return celsius + 273.15;
        }

        function swapUnits() {
            const fromUnit = document.getElementById('fromUnit');
            const toUnit = document.getElementById('toUnit');
            const temp = fromUnit.value;
            fromUnit.value = toUnit.value;
            toUnit.value = temp;
            convert();
        }

        function clearAll() {
            document.getElementById('fromValue').value = '';
            document.getElementById('toValue').value = '';
        }

        // Initialize
        updateUnits();
    </script>
</body>
</html>
