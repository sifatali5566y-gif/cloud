<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker - Toolkity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .color-display {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            margin: 1.5rem 0;
            box-shadow: var(--shadow);
        }
        .color-input-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .color-input-group input[type="color"] {
            width: 80px;
            height: 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <span>Toolkity</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-palette"></i> Color Picker</h1>
                <p>Pick colors and get HEX, RGB, and HSL values</p>
            </div>

            <div class="tool-container">
                <div class="form-group">
                    <label>Pick a color:</label>
                    <div class="color-input-group">
                        <input type="color" id="colorPicker" value="#6366f1" oninput="updateColor()">
                        <span style="font-size: 1.125rem; font-weight: 600;">Click to choose a color</span>
                    </div>
                </div>

                <div class="color-display" id="colorDisplay"></div>

                <div class="result-box">
                    <h3>Color Values</h3>
                    
                    <div class="form-group">
                        <label>HEX:</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="hexValue" readonly style="flex: 1;">
                            <button class="btn btn-secondary" onclick="copyValue('hexValue')" style="padding: 8px 16px;">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>RGB:</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="rgbValue" readonly style="flex: 1;">
                            <button class="btn btn-secondary" onclick="copyValue('rgbValue')" style="padding: 8px 16px;">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>HSL:</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="hslValue" readonly style="flex: 1;">
                            <button class="btn btn-secondary" onclick="copyValue('hslValue')" style="padding: 8px 16px;">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="messageArea"></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Toolkity. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        function updateColor() {
            const color = document.getElementById('colorPicker').value;
            document.getElementById('colorDisplay').style.backgroundColor = color;

            // HEX
            document.getElementById('hexValue').value = color.toUpperCase();

            // RGB
            const rgb = hexToRgb(color);
            document.getElementById('rgbValue').value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;

            // HSL
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            document.getElementById('hslValue').value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function rgbToHsl(r, g, b) {
            r /= 255;
            g /= 255;
            b /= 255;

            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);

                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }

            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        }

        function copyValue(elementId) {
            const element = document.getElementById(elementId);
            element.select();
            document.execCommand('copy');
            showMessage('Copied to clipboard!', 'success');
        }

        function showMessage(message, type) {
            const messageArea = document.getElementById('messageArea');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            messageArea.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
            
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 2000);
        }

        // Initialize with default color
        updateColor();
    </script>
</body>
</html>
