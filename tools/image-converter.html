<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Converter - Toolkity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <span>Toolkity</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-exchange-alt"></i> Image Converter</h1>
                <p>Convert images between different formats (PNG, JPG, WebP)</p>
            </div>

            <div class="tool-container">
                <div class="file-upload" onclick="document.getElementById('imageInput').click()">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--primary-color);"></i>
                    <p style="margin-top: 1rem;">Click to upload an image</p>
                    <input type="file" id="imageInput" accept="image/*" onchange="loadImage(event)">
                </div>

                <div id="converterControls" style="display: none; margin-top: 1.5rem;">
                    <div class="form-group">
                        <label for="format">Convert to:</label>
                        <select id="format">
                            <option value="image/png">PNG</option>
                            <option value="image/jpeg">JPG</option>
                            <option value="image/webp">WebP</option>
                        </select>
                    </div>

                    <div class="button-group">
                        <button class="btn btn-primary" onclick="convertImage()">
                            <i class="fas fa-exchange-alt"></i> Convert Image
                        </button>
                        <button class="btn btn-secondary" onclick="downloadImage()">
                            <i class="fas fa-download"></i> Download
                        </button>
                    </div>
                </div>

                <div id="previewArea" style="display: none; margin-top: 1.5rem;">
                    <h3>Converted Image</h3>
                    <div class="preview-area">
                        <img id="convertedImage" alt="Converted Image">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Toolkity. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        let originalImageData = null;
        let convertedDataUrl = null;

        function loadImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    originalImageData = e.target.result;
                    document.getElementById('converterControls').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function convertImage() {
            if (!originalImageData) return;

            const format = document.getElementById('format').value;
            const img = new Image();
            
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                convertedDataUrl = canvas.toDataURL(format, 0.95);
                
                document.getElementById('convertedImage').src = convertedDataUrl;
                document.getElementById('previewArea').style.display = 'block';
            };
            
            img.src = originalImageData;
        }

        function downloadImage() {
            if (!convertedDataUrl) {
                alert('Please convert the image first');
                return;
            }

            const format = document.getElementById('format').value;
            let extension = 'png';
            if (format === 'image/jpeg') extension = 'jpg';
            if (format === 'image/webp') extension = 'webp';

            const link = document.createElement('a');
            link.download = `converted-image.${extension}`;
            link.href = convertedDataUrl;
            link.click();
        }
    </script>
</body>
</html>
