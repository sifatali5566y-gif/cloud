<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor - Toolkity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <span>Toolkity</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-compress"></i> Image Compressor</h1>
                <p>Compress images to reduce file size while maintaining quality</p>
            </div>

            <div class="tool-container">
                <div class="file-upload" onclick="document.getElementById('imageInput').click()">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--primary-color);"></i>
                    <p style="margin-top: 1rem;">Click to upload an image</p>
                    <input type="file" id="imageInput" accept="image/*" onchange="loadImage(event)">
                </div>

                <div id="imageInfo" style="display: none; margin-top: 1.5rem;">
                    <div class="result-box">
                        <h3>Image Information</h3>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-value" id="originalSize">0</div>
                                <div class="stat-label">Original Size</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="compressedSize">0</div>
                                <div class="stat-label">Compressed Size</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="savedPercent">0%</div>
                                <div class="stat-label">Space Saved</div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="quality">Quality: <span id="qualityValue">80</span>%</label>
                        <input type="range" id="quality" min="1" max="100" value="80" 
                               style="width: 100%;" oninput="updateQuality(this.value)">
                    </div>

                    <div class="button-group">
                        <button class="btn btn-primary" onclick="compressImage()">
                            <i class="fas fa-compress"></i> Compress Image
                        </button>
                        <button class="btn btn-secondary" onclick="downloadImage()">
                            <i class="fas fa-download"></i> Download
                        </button>
                    </div>
                </div>

                <div id="previewArea" style="display: none; margin-top: 1.5rem;">
                    <h3>Preview</h3>
                    <div class="preview-area">
                        <img id="previewImage" alt="Compressed Image">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Toolkity. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        let originalFile = null;
        let compressedDataUrl = null;

        function loadImage(event) {
            const file = event.target.files[0];
            if (file) {
                originalFile = file;
                document.getElementById('originalSize').textContent = formatFileSize(file.size);
                document.getElementById('imageInfo').style.display = 'block';
                compressImage();
            }
        }

        function updateQuality(value) {
            document.getElementById('qualityValue').textContent = value;
        }

        function compressImage() {
            if (!originalFile) return;

            const quality = document.getElementById('quality').value / 100;
            const reader = new FileReader();

            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                    
                    // Calculate compressed size (approximate)
                    const compressedSize = Math.round((compressedDataUrl.length - 22) * 3 / 4);
                    const savedPercent = Math.round((1 - compressedSize / originalFile.size) * 100);
                    
                    document.getElementById('compressedSize').textContent = formatFileSize(compressedSize);
                    document.getElementById('savedPercent').textContent = savedPercent + '%';
                    
                    document.getElementById('previewImage').src = compressedDataUrl;
                    document.getElementById('previewArea').style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(originalFile);
        }

        function downloadImage() {
            if (!compressedDataUrl) {
                alert('Please compress the image first');
                return;
            }

            const link = document.createElement('a');
            link.download = 'compressed-image.jpg';
            link.href = compressedDataUrl;
            link.click();
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            else if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
            else return (bytes / 1048576).toFixed(2) + ' MB';
        }
    </script>
</body>
</html>
