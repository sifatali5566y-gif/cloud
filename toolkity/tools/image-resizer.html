<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer - Toolkity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <div class="logo">
                <i class="fas fa-tools"></i>
                <span>Toolkity</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="../index.html#about">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-expand-arrows-alt"></i> Image Resizer</h1>
                <p>Resize your images to custom dimensions</p>
            </div>

            <div class="tool-container">
                <div class="file-upload" onclick="document.getElementById('imageInput').click()">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--primary-color);"></i>
                    <p style="margin-top: 1rem;">Click to upload an image</p>
                    <input type="file" id="imageInput" accept="image/*" onchange="loadImage(event)">
                </div>

                <div id="imagePreview" class="preview-area" style="display: none;">
                    <h3>Original Image</h3>
                    <img id="originalImage" alt="Original">
                    <p id="originalDimensions"></p>
                </div>

                <div id="resizeControls" style="display: none; margin-top: 1.5rem;">
                    <div class="form-group">
                        <label for="width">Width (px):</label>
                        <input type="number" id="width" min="1" placeholder="Width">
                    </div>
                    <div class="form-group">
                        <label for="height">Height (px):</label>
                        <input type="number" id="height" min="1" placeholder="Height">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="maintainAspect" checked> Maintain aspect ratio
                        </label>
                    </div>

                    <div class="button-group">
                        <button class="btn btn-primary" onclick="resizeImage()">
                            <i class="fas fa-compress-arrows-alt"></i> Resize Image
                        </button>
                        <button class="btn btn-secondary" onclick="downloadImage()">
                            <i class="fas fa-download"></i> Download
                        </button>
                    </div>
                </div>

                <div id="resizedPreview" class="preview-area" style="display: none;">
                    <h3>Resized Image</h3>
                    <img id="resizedImage" alt="Resized">
                    <p id="resizedDimensions"></p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Toolkity. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        let originalImageData = null;
        let originalWidth = 0;
        let originalHeight = 0;

        function loadImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('originalImage');
                    img.src = e.target.result;
                    img.onload = function() {
                        originalWidth = img.naturalWidth;
                        originalHeight = img.naturalHeight;
                        originalImageData = e.target.result;
                        
                        document.getElementById('originalDimensions').textContent = 
                            `Dimensions: ${originalWidth} × ${originalHeight} px`;
                        document.getElementById('imagePreview').style.display = 'block';
                        document.getElementById('resizeControls').style.display = 'block';
                        
                        document.getElementById('width').value = originalWidth;
                        document.getElementById('height').value = originalHeight;
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('width').addEventListener('input', function() {
            if (document.getElementById('maintainAspect').checked) {
                const ratio = originalHeight / originalWidth;
                document.getElementById('height').value = Math.round(this.value * ratio);
            }
        });

        document.getElementById('height').addEventListener('input', function() {
            if (document.getElementById('maintainAspect').checked) {
                const ratio = originalWidth / originalHeight;
                document.getElementById('width').value = Math.round(this.value * ratio);
            }
        });

        function resizeImage() {
            const width = parseInt(document.getElementById('width').value);
            const height = parseInt(document.getElementById('height').value);

            if (!width || !height) {
                alert('Please enter valid dimensions');
                return;
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = width;
            canvas.height = height;

            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, width, height);
                const resizedDataUrl = canvas.toDataURL('image/png');
                
                const resizedImg = document.getElementById('resizedImage');
                resizedImg.src = resizedDataUrl;
                document.getElementById('resizedDimensions').textContent = 
                    `Dimensions: ${width} × ${height} px`;
                document.getElementById('resizedPreview').style.display = 'block';
            };
            img.src = originalImageData;
        }

        function downloadImage() {
            const resizedImg = document.getElementById('resizedImage');
            if (!resizedImg.src) {
                alert('Please resize the image first');
                return;
            }

            const link = document.createElement('a');
            link.download = 'resized-image.png';
            link.href = resizedImg.src;
            link.click();
        }
    </script>
</body>
</html>
